<div class="container py-5" style="max-width: 480px;">
  <h2 class="text-center mb-4 cyber-subtitle">NUEVA CONTRASEÑA</h2>

  <div *ngIf="tokenFaltante" class="text-center">
    <p class="lead">Este enlace no es válido.</p>
    <a routerLink="/recuperar-password" class="btn btn-warning mt-3">Pedir un enlace nuevo</a>
  </div>

  <form *ngIf="!tokenFaltante" [formGroup]="formulario" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="nuevaPassword" class="form-label">Nueva contraseña</label>
      <input
        type="password"
        id="nuevaPassword"
        class="form-control"
        formControlName="nuevaPassword"
        (blur)="formulario.get('nuevaPassword')?.markAsTouched()">
      <div class="form-text">Mínimo 8 caracteres.</div>
      <div class="text-danger small mt-1" *ngIf="formulario.get('nuevaPassword')?.invalid && formulario.get('nuevaPassword')?.touched">
        La contraseña debe tener al menos 8 caracteres.
      </div>
    </div>
    <div class="mb-3">
      <label for="confirmarPassword" class="form-label">Confirmar contraseña</label>
      <input
        type="password"
        id="confirmarPassword"
        class="form-control"
        formControlName="confirmarPassword"
        (blur)="formulario.get('confirmarPassword')?.markAsTouched()">
    </div>
    <button type="submit" class="btn btn-warning w-100" [disabled]="cargando">
      {{ cargando ? 'Actualizando...' : 'Actualizar contraseña' }}
    </button>
  </form>
</div>
