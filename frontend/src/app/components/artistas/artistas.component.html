<section class="py-5 reveal" id="artistas" appReveal>
    <div class="container">
        <h2 class="section-title text-center mb-5 cyber-subtitle">MURO DE ARTISTAS</h2>
        <div class="row g-4">
            <div class="col-md-4">
                <article class="card h-100 text-center border-purple-neon shadow-lg reveal-card" appReveal>
                    <img src="/img/img-cards-secciones/artista-de-incognito.webp" class="card-img-top rounded-circle mx-auto mt-3 artist-avatar" alt="Retrato de artista local" loading="lazy">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title fw-bold">Nombre del Artista</h5>
                        <p class="card-text small opacity-75">Especialista en Muralismo / Graffiti / etc...</p>
                        <div class="mt-auto">
                            <a href="#contacto-comision" class="btn btn-outline-purple-neon w-100 mt-2">Pedir comisión</a>
                        </div>
                    </div>
                </article>
            </div>
        </div>
        <div class="text-center mt-5">
            <button type="button" class="btn btn-outline-purple-neon btn-lg" data-bs-toggle="modal" data-bs-target="#registroModal" aria-haspopup="dialog" aria-expanded="false">
                Registrarme como Artista
            </button>
        </div>
    </div>
</section>

<!-- Modal de registro — vive aquí porque es específico de esta sección -->
<div class="modal fade" id="registroModal" tabindex="-1" aria-labelledby="tituloRegistro" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content bg-dark text-white">
            <div class="modal-header">
                <h5 class="modal-title" id="tituloRegistro">¿Eres artista?</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>Elige tu tipo de cuenta:</p>
                <button type="button" class="btn btn-outline-light w-100 mb-3">Usuario normal</button>
                <button type="button" class="btn btn-outline-info w-100">Usuario Artista</button>
            </div>
        </div>
    </div>
</div>
